name: Limpeza de anexos do Storage

on:
  schedule:
    # 06:30 UTC ~ 03:30 no horário de Brasília — fora do horário de uso.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instala dependências
        run: bun install --frozen-lockfile

      - name: Roda a limpeza de anexos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run cleanup:anexos
